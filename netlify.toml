[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

# Route /api/send-results to Netlify Serverless Function
[[redirects]]
  from = "/api/send-results"
  to = "/.netlify/functions/send-results"
  status = 200

# SPA Fallback Rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
